name: Wellness Supported Action candidate
on:
  pull_request:
    paths:
      - "src/app/wellness/**"
      - "tests/wellness-supported-action.test.mjs"
      - ".github/workflows/wellness-supported-action-candidate.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: node --experimental-strip-types --test tests/wellness-supported-action.test.mjs
      - run: npm run build
